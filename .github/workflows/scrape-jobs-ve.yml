name: Job Radar Scraper Tick (Venezuela)

# Mirror of scrape-jobs.yml, same cadence/budget/timeout — see
# job-radar-apify/backlog/venezuela-expansion.md's Día 1. Deliberately a
# SEPARATE workflow file (not more sources inside the Colombia tick's
# MAX_ROLES_PER_RUN=8 budget): sharing that budget across countries would
# dilute both countries' freshness. As its own workflow, GitHub treats it as
# an independent concurrent job (well under the account's 20-concurrent-jobs
# limit) and it still costs $0 on this public repo.

on:
  # Manual runs validated against real production data (2026-08-02): 105 VE
  # jobs saved with country='VE', role_source_runs rows correctly isolated
  # under the "-VE" adapter names, no interference with Colombia's cadence
  # tables. Same cadence as scrape-jobs.yml from here on — the separate
  # concurrency group below (not "scrape-jobs-tick") is what keeps this
  # running in parallel with Colombia's tick instead of queuing behind it,
  # so Colombia's freshness never slows down because Venezuela was added.
  schedule:
    # P3 (2026-09-15): bajado de */15 a */30 como EXPERIMENTO medible, no
    # como arreglo conocido. Actions entrega ~6 ticks/día pida lo que pida
    # este cron (12 ejecuciones en 47 h frente a las 188 solicitadas), y el
    # browser-tick — 4 min, grupo de concurrencia propio, cron diario —
    # dispara con 3-5 h de retraso, así que el retraso no lo causa nuestra
    # configuración. Hipótesis: pedir 96 disparos/día es parte de lo que
    # hace que GitHub despriorice este repositorio. No se pierde cadencia
    # real al bajarlo. Se mide con scrape_runs a los 7 días; si no mejora,
    # se revierte esta línea y se escala a docs/adr/0003-scheduler-cadence.md.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# A DIFFERENT group name than scrape-jobs.yml's "scrape-jobs-tick" is the
# whole point — concurrency groups are global across workflow files, not
# scoped per file, so reusing that name here would serialize Venezuela's
# runs behind Colombia's instead of letting them run in parallel.
concurrency:
  group: scrape-jobs-ve-tick
  cancel-in-progress: false

jobs:
  scrape-tick-ve:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: |
          cd job-radar-apify
          npm ci

      - name: Run Scraper Tick (Venezuela)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Optional — Jooble-VE adapter no-ops (returns 0 jobs) if unset.
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          TICK_COUNTRY: VE
        run: |
          cd job-radar-apify
          npx tsx scripts/run-scrape-tick.ts

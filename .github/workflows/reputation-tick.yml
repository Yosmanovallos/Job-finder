name: Company Reputation Tick

on:
  schedule:
    - cron: "0 6 1 * *" # Monthly, 1st at 06:00 UTC — reputation rankings
      # change on an annual/semi-annual cadence, not worth running more
      # often (unlike scrape-jobs.yml's 15 min or indexing-tick.yml's
      # hourly). Also matches Computrabajo's R4 discovery batch (~15
      # companies/run): a monthly cadence lets it grow the curated set
      # incrementally without re-hitting a source that hardens blocking
      # under repeated short-window requests (see computrabajo.ts).
  workflow_dispatch:

concurrency:
  group: reputation-tick
  cancel-in-progress: false

jobs:
  reputation-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          # v5 caches by the root package.json's packageManager (pnpm, for
          # job-radar-local), which the runner lacks: off, as in v4.
          package-manager-cache: false

      - name: Install Dependencies
        run: |
          cd job-radar-apify
          npm ci || npm install

      - name: Run reputation tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd job-radar-apify
          npx tsx scripts/run-reputation-tick.ts

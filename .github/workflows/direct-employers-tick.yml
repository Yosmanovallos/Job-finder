name: Direct Employers Tick

# Official vacancies straight from each employer's public ATS board
# (job-radar-apify/docs/adr/0006-direct-employers.md). Writes only the
# direct-employers tables, never `jobs`; nothing here is shown on the site
# until phase D4. The web server never imports this code.
on:
  schedule:
    # Every hour, off the hour to avoid the other ticks. Each run reads the
    # oldest due boards until its deadline (--deadline-min); a board is re-read
    # once 5 h passed (MIN_INTERVAL_HOURS in src/direct/tick.ts), so each one is
    # read every 5-6 h however many boards there are, up to what 24 runs fit.
    - cron: "17 * * * *"
    # Employer discovery has its own workflow and concurrency group so a
    # long-running tick cannot displace a scheduled discovery run.
  workflow_dispatch:
    inputs:
      mode:
        description: "tick | dry-run | dry-run-one | tick-one | migrate-dry-run | migrate | seed-dry-run | seed | seed-one-dry-run | seed-one | domain-census | discover-dry-run | discover | coverage | computrabajo-coverage | computrabajo-backlog | frisby-canary | altipal-canary | identity-canary | copy-audit | db-size | cc-tenants | review-list | review-approve-dry-run | review-approve | cv-purge-dry-run | cv-purge | saved-jobs-migrate-dry-run | saved-jobs-migrate"
        required: true
        default: "dry-run"
        type: choice
        options:
          - tick
          - dry-run
          - dry-run-one
          - tick-one
          - migrate-dry-run
          - migrate
          - seed-dry-run
          - seed
          - seed-one-dry-run
          - seed-one
          # Phase D3 (ADR 0006 §7.1). domain-census, discover-dry-run and
          # coverage only READ the database; discover writes (insert-only).
          - domain-census
          - discover-dry-run
          - discover
          - coverage
          - computrabajo-coverage
          - computrabajo-backlog
          # Manual read-only live source check; no database access.
          - frisby-canary
          - altipal-canary
          - identity-canary
          # Read-only audit of board rows linked to official projections.
          - copy-audit
          # Read-only size report (pg_database_size + biggest tables).
          - db-size
          # Read-only, no database: Workday / SmartRecruiters boards seen by
          # Common Crawl that list postings in Colombia, for human review.
          - cc-tenants
          # Human review of discovery (scripts/direct-discovery-review.ts):
          # list reads; approve promotes ONE board the evidence shows, after
          # re-listing it (insert-only). Needs company_key and board below.
          - review-list
          - review-approve-dry-run
          - review-approve
          # Not direct-employer work, but this is the workflow that can be
          # dispatched from a branch: empties the rows of the removed CV
          # Generator tables (scripts/purge-cv-data.ts, owner 2026-10-22).
          - cv-purge-dry-run
          - cv-purge
          # Not direct-employer work either: creates the saved-jobs table of
          # "Mi cuenta" (scripts/migrate-saved-jobs.ts, owner 2026-10-27). One
          # new table, nothing existing altered; dry-run only reads.
          - saved-jobs-migrate-dry-run
          - saved-jobs-migrate
      company_key:
        description: "review-approve: company_key del candidato"
        required: false
        type: string
      board:
        description: "review-approve: ats_type:ats_ref (p. ej. lever:despegar)"
        required: false
        type: string
      seed_slug:
        description: "seed-one / dry-run-one / tick-one: slug exacto del seed"
        required: false
        type: string

concurrency:
  group: direct-employers-tick
  cancel-in-progress: false

jobs:
  direct-employers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          # v5 caches by the root package.json's packageManager (pnpm, for
          # job-radar-local), which the runner lacks: off, as in v4.
          package-manager-cache: false

      - name: Install Dependencies
        run: |
          cd job-radar-apify
          npm ci || npm install

      # Migration and seed run only when dispatched by hand, never on the
      # schedule (schema changes are explicit — job-radar-apify/CLAUDE.md).
      # Discovery runs daily (insert-only) and by hand.
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ github.event_name == 'schedule' && 'tick' || inputs.mode }}
          COMPANY_KEY: ${{ inputs.company_key }}
          BOARD: ${{ inputs.board }}
          SEED_SLUG: ${{ inputs.seed_slug }}
        run: |
          cd job-radar-apify
          set -o pipefail
          case "$MODE" in
            tick)            cmd="npx tsx scripts/run-direct-tick.ts --allow-remote-db --limit 1000 --deadline-min 14" ;;
            dry-run)         cmd="npx tsx scripts/run-direct-tick.ts --dry-run" ;;
            dry-run-one|tick-one)
              [[ "$SEED_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "seed_slug inválido"; exit 1; }
              if [ "$MODE" = "dry-run-one" ]; then
                cmd="npx tsx scripts/run-direct-tick.ts --dry-run --employer $SEED_SLUG --include-disabled --allow-live-sources"
              else
                cmd="npx tsx scripts/run-direct-tick.ts --employer $SEED_SLUG --force --allow-remote-db --allow-live-sources"
              fi ;;
            migrate-dry-run) cmd="npx tsx scripts/migrate-direct-employers.ts --dry-run --allow-remote-db" ;;
            migrate)         cmd="npx tsx scripts/migrate-direct-employers.ts --allow-remote-db" ;;
            seed-dry-run)    cmd="npx tsx scripts/seed-direct-employers.ts --dry-run" ;;
            seed)            cmd="npx tsx scripts/seed-direct-employers.ts --allow-remote-db" ;;
            seed-one-dry-run|seed-one)
              [[ "$SEED_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "seed_slug inválido"; exit 1; }
              cmd="npx tsx scripts/seed-direct-employers.ts --slug $SEED_SLUG --allow-remote-db"
              [ "$MODE" = "seed-one-dry-run" ] && cmd="$cmd --dry-run" ;;
            domain-census)   cmd="npx tsx scripts/direct-domain-census.ts --allow-remote-db" ;;
            discover-dry-run) cmd="npx tsx scripts/discover-direct-employers.ts --dry-run --allow-remote-db --limit 100" ;;
            discover)        cmd="npx tsx scripts/discover-direct-employers.ts --allow-remote-db --limit 1500 --max-enables 50 --deadline-min 16" ;;
            coverage)        cmd="npx tsx scripts/direct-coverage.ts --allow-remote-db" ;;
            computrabajo-coverage) cmd="npx tsx scripts/direct-computrabajo-coverage.ts --allow-remote-db" ;;
            computrabajo-backlog) cmd="npx tsx scripts/direct-computrabajo-coverage.ts --all --allow-remote-db" ;;
            frisby-canary)  cmd="npx tsx scripts/canary-frisby.ts --allow-live-sources" ;;
            altipal-canary) cmd="npx tsx scripts/canary-altipal.ts --allow-live-sources" ;;
            identity-canary) cmd="npx tsx scripts/audit-official-identity.ts --dry-run --allow-remote-db" ;;
            copy-audit)     cmd="npx tsx scripts/audit-official-copies.ts --dry-run --allow-remote-db" ;;
            db-size)         cmd="npx tsx scripts/direct-db-size.ts --allow-remote-db" ;;
            cc-tenants)      cmd="npx tsx scripts/direct-cc-tenants.ts --max-boards 500 --deadline-min 17" ;;
            review-list)     cmd="npx tsx scripts/direct-discovery-review.ts list --decision needs_review --limit 100 --allow-remote-db" ;;
            review-approve-dry-run|review-approve)
              # Inputs arrive through env, never interpolated into the script.
              [[ "$COMPANY_KEY" =~ ^[a-z0-9]{1,120}$ ]] || { echo "company_key inválido"; exit 1; }
              [[ "$BOARD" =~ ^[a-z]+:[A-Za-z0-9._@/-]{1,200}$ ]] || { echo "board inválido"; exit 1; }
              cmd="npx tsx scripts/direct-discovery-review.ts approve $COMPANY_KEY $BOARD --allow-remote-db"
              [ "$MODE" = "review-approve-dry-run" ] && cmd="$cmd --dry-run" ;;
            cv-purge-dry-run) cmd="npx tsx scripts/purge-cv-data.ts --dry-run --allow-remote-db" ;;
            cv-purge)         cmd="npx tsx scripts/purge-cv-data.ts --execute --allow-remote-db" ;;
            saved-jobs-migrate-dry-run) cmd="npx tsx scripts/migrate-saved-jobs.ts --dry-run --allow-remote-db" ;;
            saved-jobs-migrate) cmd="npx tsx scripts/migrate-saved-jobs.ts --allow-remote-db" ;;
            *) echo "modo desconocido: $MODE"; exit 1 ;;
          esac
          echo "## Direct employers — $MODE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "computrabajo-backlog" ]; then
            echo 'Listado completo en el log de esta corrida (JSONL); ninguna escritura en la base de datos.' >> "$GITHUB_STEP_SUMMARY"
            $cmd
            exit 0
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          $cmd 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

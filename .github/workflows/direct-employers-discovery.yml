name: Direct Employers Discovery

# Separate from the board tick: the old daily discovery schedule was not
# appearing in recent Actions history while tick runs occupied its group.
on:
  schedule:
    - cron: "31 3,11,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (read-only) | execute (insert-only promotion)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      focus:
        description: "computrabajo (Colombia) | all (todas las bolsas)"
        required: true
        default: computrabajo
        type: choice
        options:
          - computrabajo
          - all

permissions:
  contents: read

concurrency:
  group: direct-employers-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: job-radar-apify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - run: npm ci
      # ATS side first (INV-025, ADR 0006 §13): pending inventory boards are
      # probed and, under the INV-010…INV-012 rules, enabled (insert-only, at
      # most 25 per run). Same schedule and timeout; the run's time is split.
      - name: Probe ATS inventory boards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ github.event_name == 'schedule' && 'execute' || inputs.mode }}
        run: |
          if [ "$MODE" = dry-run ]; then
            npx tsx scripts/direct-ats-probe.ts --allow-remote-db --limit 500 --deadline-min 6
          elif [ "$MODE" = execute ]; then
            npx tsx scripts/direct-ats-probe.ts --execute --allow-remote-db --limit 500 --max-enable 25 --deadline-min 6
          else
            echo "Unsupported discovery mode" >&2
            exit 1
          fi
      - name: Discover employer boards
        # Runs even when the inventory probe failed: the two paths are independent.
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ github.event_name == 'schedule' && 'execute' || inputs.mode }}
          FOCUS: ${{ github.event_name == 'schedule' && 'computrabajo' || inputs.focus }}
        run: |
          if [ "$FOCUS" = computrabajo ]; then
            focus_arg="--focus-computrabajo"
          elif [ "$FOCUS" = all ]; then
            focus_arg=""
          else
            echo "Unsupported discovery focus" >&2
            exit 1
          fi
          if [ "$MODE" = dry-run ]; then
            npx tsx scripts/discover-direct-employers.ts --dry-run --allow-remote-db --limit 100 --min-count 1 --deadline-min 9 $focus_arg
          elif [ "$MODE" = execute ]; then
            npx tsx scripts/discover-direct-employers.ts --allow-remote-db --limit 1000 --min-count 1 --max-enables 10 --deadline-min 9 $focus_arg
          else
            echo "Unsupported discovery mode" >&2
            exit 1
          fi

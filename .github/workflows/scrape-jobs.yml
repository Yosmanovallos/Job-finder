name: Job Radar Scraper Tick

on:
  schedule:
    # P3 (2026-09-15): bajado de */15 a */30 como EXPERIMENTO medible, no
    # como arreglo conocido. Actions entrega ~6 ticks/día pida lo que pida
    # este cron (12 ejecuciones en 47 h frente a las 188 solicitadas), y el
    # browser-tick — 4 min, grupo de concurrencia propio, cron diario —
    # dispara con 3-5 h de retraso, así que el retraso no lo causa nuestra
    # configuración. Hipótesis: pedir 96 disparos/día es parte de lo que
    # hace que GitHub despriorice este repositorio. No se pierde cadencia
    # real al bajarlo. Se mide con scrape_runs a los 7 días; si no mejora,
    # se revierte esta línea y se escala a docs/adr/0003-scheduler-cadence.md.
    - cron: "*/30 * * * *" # $0 USD en repositorio público
  workflow_dispatch:

# If a tick is still running when the next 15-min trigger fires (e.g. some
# roles hit their timeout), queue the new run instead of letting it start
# concurrently — two overlapping ticks would independently query "what's due"
# and could both scrape the same role/source pair at the same moment,
# doubling request volume right after today's pacing fixes for Indeed/Workana.
# cancel-in-progress: false so the in-flight run is never killed mid-scrape.
concurrency:
  group: scrape-jobs-tick
  cancel-in-progress: false

jobs:
  scrape-tick:
    runs-on: ubuntu-latest
    # The script has its own internal 20-min soft deadline (run-scrape-tick.ts)
    # after which it exits cleanly on its own — this ceiling just needs enough
    # margin above that plus checkout/install overhead so GitHub's hard kill
    # is a last resort, not the normal way a run ends (a hard kill mid-run
    # already caused a real data-loss bug once, see scrape-worker.ts).
    timeout-minutes: 27
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # P3: se mantiene en 20 DELIBERADAMENTE por ahora. La app declara
          # engines.node = 24.18.0 y los 6 @supabase/* exigen >=22, así que
          # cada ejecución emite EBADENGINE (y Actions avisa de que Node 20
          # está deprecado). El salto a 24 cambia el comportamiento de red de
          # got-scraping/playwright/undici contra las fuentes reales, algo que
          # ninguna prueba local puede verificar, así que se sube por separado
          # y con su propio canario — no mezclado con los plazos de P3.
          node-version: "20"

      - name: Install Dependencies
        run: |
          cd job-radar-apify
          npm ci

      - name: Run Scraper Tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Optional — Jooble adapter no-ops (returns 0 jobs) if unset.
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          cd job-radar-apify
          npx tsx scripts/run-scrape-tick.ts

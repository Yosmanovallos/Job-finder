name: Verify job trust

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "job-radar-apify/src/components/ApplyGateModal.tsx"
      - "job-radar-apify/src/components/JobCard.tsx"
      - "job-radar-apify/src/components/JobDetailPanel.tsx"
      - "job-radar-apify/src/components/JobListItem.tsx"
      - "job-radar-apify/src/index.ts"
      - "job-radar-apify/src/lib/job-availability.ts"
      - "job-radar-apify/src/lib/job-date-label.ts"
      - "job-radar-apify/src/lib/source-date.ts"
      - "job-radar-apify/src/sections/Dashboard.tsx"
      - "job-radar-apify/tests/validate-job-date-label.test.ts"
      - "job-radar-apify/scripts/audit-job-trust.ts"
      - ".github/workflows/verify-job-trust.yml"

permissions:
  contents: read

concurrency:
  group: verify-job-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: job-radar-apify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration

name: Verify official employer coverage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/direct-employers-discovery.yml"
      - ".github/workflows/direct-employers-tick.yml"
      - ".github/workflows/verify-official-coverage.yml"
      - "job-radar-apify/scripts/discover-direct-employers.ts"
      - "job-radar-apify/scripts/direct-computrabajo-coverage.ts"
      - "job-radar-apify/src/direct/discovery/computrabajo-backlog.ts"
      - "job-radar-apify/data/computrabajo-official-reviews.json"
      - "job-radar-apify/tests/validate-computrabajo-backlog.test.ts"
      - "job-radar-apify/scripts/seed-direct-employers.ts"
      - "job-radar-apify/data/direct-employers.seed.json"
      - "job-radar-apify/src/db/direct-discovery-repository.ts"
      - "job-radar-apify/src/direct/discovery/coverage.ts"
      - "job-radar-apify/tests/validate-direct-discovery.ts"
      - "job-radar-apify/scripts/direct-ats-inventory.ts"
      - "job-radar-apify/scripts/direct-ats-probe.ts"
      - "job-radar-apify/scripts/direct-ats-inventory-review.ts"
      - "job-radar-apify/data/direct-discovery-agencies.json"
      - "job-radar-apify/scripts/migrate-direct-employers.ts"
      - "job-radar-apify/scripts/run-isolated-tests.ts"
      - "job-radar-apify/src/db/schema.sql"
      - "job-radar-apify/src/db/direct-inventory-repository.ts"
      - "job-radar-apify/src/direct/discovery/**"
      - "job-radar-apify/tests/validate-direct-inventory.test.ts"
      - "job-radar-apify/tests/validate-direct-inventory.ts"
      - "job-radar-apify/tests/validate-direct-inventory-probe.test.ts"
      - "job-radar-apify/tests/validate-direct-inventory-probe.ts"

permissions:
  contents: read

concurrency:
  group: verify-official-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: job-radar-apify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:direct

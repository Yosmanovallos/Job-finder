name: Browser Scrape Tick (Glassdoor + Indeed)

# Separate from scrape-jobs.yml on purpose (see src/engine/browser-fetch.ts
# and scripts/run-browser-tick.ts): Glassdoor and Indeed are both blocked by
# Cloudflare from GitHub Actions' Azure IPs unless routed through a real
# headless browser + a residential proxy — much heavier per-request than
# the fast tick's got-scraping/fetch adapters, so it gets its own cadence
# and its own workflow/concurrency group instead of competing for the fast
# tick's 3-minute global-catalog budget.
#
# Every 2 days (day-of-month parity, not a precise 48h clock) — matches the
# low request volume this needs; there is no cost benefit to running more
# often given both sources' `fromage=1`/`fromAge=1` freshness filter and
# saveJobs' existing dedupe across runs.
on:
  schedule:
    - cron: "0 13 */2 * *"
  workflow_dispatch:

concurrency:
  group: scrape-browser-tick
  cancel-in-progress: false

jobs:
  browser-scrape-tick:
    runs-on: ubuntu-latest
    # Headless browser page loads (several seconds each) across ~32 queries
    # (Glassdoor CO+VE, Indeed CO+VE) plus Playwright/Chromium install —
    # generous margin since this runs far less often and isn't competing
    # with anything else.
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Alineado con engines.node = 24.18.0 (y con los 6 @supabase/*, que
          # exigen >=22): en Node 20 cada ejecución emitía EBADENGINE y Actions
          # ya avisaba de que 20 está deprecado.
          #
          # Se subió SOLO, separado del despliegue de P3 (2026-09-16), porque
          # cambia el comportamiento de red de got-scraping/playwright/undici
          # contra las fuentes reales y eso ninguna prueba local puede
          # verificar. Verificar con scripts/verify-p3-deadlines.ts: una fuente
          # que pase de success a blocked/empty es este salto, no P3. Revertir
          # es cambiar esta línea de vuelta a "20".
          # Versión EXACTA, no "24": package.json fija engines.node en
          # 24.18.0 (un pin exacto, no un rango), así que pedir "24" trae
          # 24.20.0 y el propio paquete sigue emitiendo EBADENGINE. Fijarla
          # aquí honra la declaración existente en vez de relajarla, y de
          # paso hace la instalación reproducible entre ejecuciones.
          node-version: "24.18.0"

      - name: Install Dependencies
        run: |
          cd job-radar-apify
          npm ci

      - name: Install Playwright Chromium
        run: |
          cd job-radar-apify
          npx playwright install --with-deps chromium

      - name: Run Browser Scrape Tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
        run: |
          cd job-radar-apify
          npx tsx scripts/run-browser-tick.ts

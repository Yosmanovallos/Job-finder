<script>AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["97074075100160710","Cloud Data and Analytics Consultant, Professional Services (English, Portuguese, Spanish)","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckZPTyYNswRKmnVu7cNoCiOxrCjTHdW5ejz3yLoYgh7TAEjsA9yzvglO_dt9ekfSnBkMYelJYFxp7XASdISrNn0r4fO3csqbwUZGPVzzV9EmIYyWBuit5aZMmIOORsg%3D%3D_V2\u0026loc\u003dBR\u0026title\u003dCloud+Data+and+Analytics+Consultant",[null,"\u003cul\u003e\n\u003cli\u003eWork with customer technical leads, client executives, and partners to manage and deliver successful implementations of cloud solutions, becoming a trusted advisor to decision makers throughout the engagement.\u003c/li\u003e\n\u003cli\u003eWork with internal specialists, Product, and Engineering teams to package best practices and lessons learned into thought leadership, methodologies, and published assets.\u003c/li\u003e\n\u003cli\u003eInteract with Sales, partners, and customer technical stakeholders to manage project scope, priorities, deliverables, risks/issues, and timelines for successful client outcomes.\u003c/li\u003e\n\u003cli\u003eAdvocate for customer needs in order to overcome adoption blockers and drive new feature development based on field experience.\u003c/li\u003e\n\u003cli\u003ePropose solution architectures and manage the deployment of cloud-based distributed virtualized infrastructure solutions according to complex customer requirements and implementation of best practices.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eBachelor’s degree or equivalent practical experience.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003e5 years of experience troubleshooting technical issues for internal/external partners or customers.\u003c/li\u003e\n\u003cli\u003eExperience in either system design or reading code (e.g., Java, C++, Python).\u003c/li\u003e\n\u003cli\u003eAbility to communicate in English and either Portuguese or Spanish fluently to engage with regional LATAM stakeholders.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eProfessional Cloud Certification.\u003c/li\u003e\n\u003cli\u003e8 years of experience working with software code in one or more languages (e.g., Python, Java, Scala, or Go).\u003c/li\u003e\n\u003cli\u003e\u003cdiv\u003eExperience designing and deploying large-scale distributed data processing systems with one or more technologies (e.g. Relational Databases, Data Warehousing Databases, Hadoop, Spark, Teradata, BigQuery, others).\u003cbr\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli\u003eExperience with reading software code in one or more languages (e.g., Java, JavaScript, or Python).\u003c/li\u003e\n\u003cli\u003eExperience in customer facing ou consulting roles in project delivery.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["São Paulo, Brazil",["São Paulo, State of São Paulo, Brazil"],"São Paulo",null,"SP","BR"],["Santiago, Chile",["Santiago, Santiago Metropolitan Region, Chile"],"Santiago",null,"Santiago Metropolitan Region","CL"],["Buenos Aires, Argentina",["Buenos Aires, Argentina"],"Buenos Aires",null,"Buenos Aires","AR"],["Bogotá, Bogota, Colombia",["Bogotá, Bogota, Colombia"],"Bogotá",null,"Bogota","CO"],["Mexico City, CDMX, Mexico",["Mexico City, CDMX, Mexico"],"Mexico City",null,"CDMX","MX"]],[null,"\u003cp\u003eThe Google Cloud Consulting Professional Services team guides customers through the moments that matter most in their cloud journey to help businesses thrive. We help customers transform and evolve their business through the use of Google’s global network, web-scale data centers, and software infrastructure. As part of an innovative team in this rapidly growing business, you will help shape the future of businesses of all sizes and use technology to connect with customers, employees, and partners.\u003cbr\u003e\u003c/p\u003e\n\u003cp\u003eAs a Cloud Consultant, you will work with customers on critical projects to help them transform their businesses. You'll provide management, consulting, and technical capabilities to customer engagements while working with customer executives and key technical leaders to deploy solutions via Google Cloud Platform. You will also work with key partners, serving accounts to manage programs, deliver consulting services, and provide technical guidance and best practice expertise.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGoogle Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s cutting-edge technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems.\u003c/p\u003e"],[2],[1790600984,80000000],[1790680074,883000000],[1790680075,119000000],[null,"\u003cp\u003e\u003cb\u003ePlease submit your resume in English - we can only consider applications submitted in this language.\u003c/b\u003e\u003c/p\u003e\u003cp\u003eOnly applications of candidates with Mexican citizenship will be evaluated for this role in compliance with the provisions of Article 7 of the Federal Labor Law.\u003cbr\u003e\u003cbr\u003eIn most instances, this position requires in-person interviews as part of the hiring process.\u003c/p\u003e"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: \u003cb\u003eSão Paulo, Brazil; Santiago, Chile; Buenos Aires, Argentina; Bogotá, Bogota, Colombia; Mexico City, CDMX, Mexico\u003c/b\u003e."],[null,"\u003cul\u003e\n\u003cli\u003eBachelor’s degree or equivalent practical experience.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003e5 years of experience troubleshooting technical issues for internal/external partners or customers.\u003c/li\u003e\n\u003cli\u003eExperience in either system design or reading code (e.g., Java, C++, Python).\u003c/li\u003e\n\u003cli\u003eAbility to communicate in English and either Portuguese or Spanish fluently to engage with regional LATAM stakeholders.\u003c/li\u003e\n\u003c/ul\u003e"],2],["81449559602930374","Principal Strategy and Insights Lead, SP Latam","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckTmn5IlhRrR3CI80gMRl5VTdJi1D0st18FvrCsp61I-AEjsA9yzvgu6SdQIGZB4GuTlxb7wNgxb3g4LhQgJFfuJKsSedk3ysiZ4EnMZstnQ8HBUlGGa1smubfKwctA%3D%3D_V2\u0026loc\u003dCO\u0026title\u003dPrincipal+Strategy+and+Insights+Lead",[null,"\u003cul\u003e\n\u003cli\u003eUtilize AI technologies to analyze first- and third-party data, uncovering actionable intelligence on consumer behavior, industry trends, and market opportunities.\u003c/li\u003e\n\u003cli\u003ePartner closely with Account teams to formulate vertical-specific thought leadership strategies. Craft compelling narratives that test conventional thinking and directly support our clients' goals.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eTransform complex data into forward-thinking, actionable stories. Help clients deeply understand their audiences and business opportunities to develop smarter strategies to reach their consumers.\u003c/li\u003e\n\u003cli\u003eEmpower sales conversations by seamlessly aligning Google’s products with client and partner objectives. Analyze the market to identify new business opportunities and support the creation of powerful sales pitches and narratives.\u003c/li\u003e\n\u003cli\u003eDesign and develop automated, highly scalable insights tools, including interactive dashboards and AI-driven insights agents.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eBachelor's degree or equivalent practical experience.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003e5 years of experience in advertising sales, marketing, consulting, or media (e.g., search, social, mobile, display, and video media).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003e5 years of experience in consumer and market insights, media measurement, and privacy landscape.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eExperience in data analysis, conducting quantitative and qualitative research, uncovering first-party data insights from complex datasets.\u003c/li\u003e\n\u003cli\u003eExperience in strategy consulting, consumer research or business development teams or companies.\u003c/li\u003e\n\u003cli\u003eAbility to translate data into compelling narratives, sales pitches, and C-level presentations.\u003c/li\u003e\n\u003cli\u003eAbility to navigate ambiguity and manage multiple assignments simultaneously in a changing environment.\u003c/li\u003e\n\u003cli\u003eStrategic thinker who is collaborative and fosters team innovation.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Bogotá, Bogota, Colombia",["Bogotá, Bogota, Colombia"],"Bogotá",null,"Bogota","CO"],["Santiago, Chile",["Santiago, Santiago Metropolitan Region, Chile"],"Santiago",null,"Santiago Metropolitan Region","CL"],["Lima, Peru",["Lima, Peru"],"Lima",null,"Callao Region","PE"]],[null,"As a Principal Strategy and Insights Lead for Spanish-Speaking LatAm, you will serve as a trusted thought leader for your industry and bets pillars, working closely with sales leaders. You will shape customer and industry-wide conversations at scale through storytelling, highlighting key shifts in consumer behavior and dynamics that drive business growth. You will also partner to uncover top-priority opportunities through customized solutions and share novel ideas that optimally position Google’s product offerings.The Go-to-Market Operations (GtM) team ensures Google's complex and ever-evolving Ads business runs smoothly. We are instrumental in setting go-to-market strategy, and ensuring flawless execution and operations against the strategy. We have teams embedded in each of the major Ads business areas as well as global teams that work across the business areas. Team members are analytical and strategic, with a pragmatic sense of how to get things done."],[2],[1790151007,548000000],[1790595577,12000000],[1790595577,425000000],[null,"Please submit your resume in English - we can only consider applications submitted in this language."],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: \u003cb\u003eBogotá, Bogota, Colombia; Santiago, Chile; Lima, Peru\u003c/b\u003e."],[null,"\u003cul\u003e\n\u003cli\u003eBachelor's degree or equivalent practical experience.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003e5 years of experience in advertising sales, marketing, consulting, or media (e.g., search, social, mobile, display, and video media).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003e5 years of experience in consumer and market insights, media measurement, and privacy landscape.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],2],["144031706314089158","Workspace Sales Specialist III, Enterprise, Strategic Accounts, Startups, Digital Native, Greenfield, Google Cloud","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckT8e9VmBEjmDx7OmsfLn_oHpV7qIf96QJhEQmAQIsircEjsA9yzvglJ0uOgrSxSoimGlD08--_2eXdACesAX6nb68gTtaRMJHLSa68rA6mSBCvqLfrEK5FAo85G4vw%3D%3D_V2\u0026loc\u003dCO\u0026title\u003dWorkspace+Sales+Specialist+III",[null,"\u003cul\u003e\n\u003cli\u003e\u003cspan dir\u003d\"ltr\"\u003eBuild relationships with customers as a subject matter expert and trusted advisor, managing complex business cycles, identifying solution use cases, and influencing long-term direction of accounts.\u003c/span\u003e\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eDeliver against quota and achieve or exceed business and growth goals while forecasting and reporting your territory’s business.\u003c/li\u003e\n\u003cli\u003eWork with Google accounts and cross-functional teams (e.g., Customer Engineering, Marketing, Customer Success, Product, Engineering, Channels) to develop go-to-market strategies, drive pipeline and business growth, close agreements, understand customer, and provide excellent prospect and customer experience.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eConstruct and execute an effective territory development plan.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eLead prospecting, acquisition, and development of new Workspace opportunities in your assigned territory, creating and building customer relationships from scratch, while also maintaining and building current accounts.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eBachelor's degree or equivalent practical experience.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003e10 years of experience in a sales role in the enterprise software or cloud space.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience selling Software as a Service (SaaS), Productivity, or Collaboration technology solutions to clients.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eExperience carrying and exceeding business goals in a sales role.\u003c/li\u003e\n\u003cli\u003eExperience prioritizing, planning, and organizing solution-based sales activity within complex business cycles, including qualifying high value accounts and leveraging our partner ecosystem.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience working with internal/external teams, including account teams, technical leads, procurement, and legal, to inventory existing software estate, build business cases for transformation with implementation plans, and close agreements.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eKnowledge of market trends, products, and solutions in Cloud and Productivity and Collaboration.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Bogotá, Bogota, Colombia",["Bogotá, Bogota, Colombia"],"Bogotá",null,"Bogota","CO"]],[null,"As a Workspace Sales Specialist, you will help us grow our Productivity and Collaboration business by building and expanding relationships with new and existing customers. In this role, you will work with customers to deliver true business value, demonstrate product functionality, and provide a comprehensive overview of key business use cases. You will lead day-to-day relationships with cross-functional team members and external customers, leading with empathy, while identifying innovative ways to multiply your impact and the impact of the team as a whole to drive overall value for Google Cloud.Google Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems."],[2],[1791452277,267000000],[1791452277,267000000],[1791452277,341000000],[null,"Please submit your resume in English - we can only consider applications submitted in this language."],null,null,[null,""],[null,"\u003cul\u003e\n\u003cli\u003eBachelor's degree or equivalent practical experience.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003e10 years of experience in a sales role in the enterprise software or cloud space.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience selling Software as a Service (SaaS), Productivity, or Collaboration technology solutions to clients.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],3],["109068733346915014","AI Outcome Customer Engineer, Google Cloud (English, Spanish)","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2Fckb7oKKGjfW82P8vOoWY6RimWQ-bbtNRTS5PuxsDgnnlEEjsA9yzvgmuX6PKiX9oNaDomCFKJBeayt60NsSb3W1Q8Y84V9mFs4QWLfgGAnX-ae3_fTf28eeRxcKH4VQ%3D%3D_V2\u0026loc\u003dMX\u0026title\u003dAI+Outcome+Customer+Engineer",[null,"\u003cul\u003e\n\u003cli\u003eManage internal and external stakeholders, including customers, providing engagement reports and gathering and escalating client signals and product feedback through internal processes.\u003c/li\u003e\n\u003cli\u003eLead technical onboarding, environment readiness (capacity, quotas, security, IAM/SSO, enterprise connectors, ECMs, and data residency), and organizational change management required to operationalize AI-driven workflows into daily production.\u003c/li\u003e\n\u003cli\u003eEmbedded with customer engineering and business teams to map workflows and data pipelines, identify integration constraints, shape tools/APIs, and define MVP requirements for GenAI and autonomous agent systems. \u003c/li\u003e\n\u003cli\u003eDefine impact hypotheses, baseline benchmarks, and measurable KPIs, tracking production consumption velocity, deliverable reliability, and business ROI to report outcomes to C-suite and executive sponsors. \u003c/li\u003e\n\u003cli\u003eStructure and own end-to-end delivery roadmaps for multi-workstream AI deployments, defining milestones, technical dependencies, acceptance criteria, and sequencing decisions to protect the critical path while leading technical delivery across engineers.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eBachelor’s degree in Computer Science, Engineering, a related technical field, or equivalent practical experience.\u003c/li\u003e\n\u003cli\u003e5 years of experience in customer-facing technical delivery leadership, technical engagement management, solutions architecture, or enterprise AI/Cloud consulting.\u003c/li\u003e\n\u003cli\u003eExperience reading, evaluating, or debugging code in a general-purpose coding language (e.g., Python, Java, JavaScript) and diagnosing architectural blockers.\u003c/li\u003e\n\u003cli\u003eExperience in system design or orchestration frameworks (e.g., LangGraph, AutoGen, CrewAI).\u003c/li\u003e\n\u003cli\u003eExperience structuring technical delivery roadmaps, managing production deployments, and interfacing with product or engineering organizations.\u003c/li\u003e\n\u003cli\u003eAbility to communicate in English and Spanish fluently to engage with regional enterprise customers and global product teams.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eExperience leading enterprise Generative AI, LLM-based agentic workflows, or RAG architecture engagements from prototype to production readiness.\u003c/li\u003e\n\u003cli\u003eExperience working closely alongside Forward Deployed Engineers (FDEs), software engineering squads, sales and Product/Research teams to build and scale custom technical solutions.\u003c/li\u003e\n\u003cli\u003eSharp sequencing instincts with the ability to move fluidly between system-level architecture discussions and execution-level technical detail (e.g., code review, API integrations, evaluation benchmarking).\u003c/li\u003e\n\u003cli\u003eProven track record of operating with high autonomy in ambiguous environments, establishing structure, building reusable delivery playbooks, and driving 0→1 initiatives to scale.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Mexico City, CDMX, Mexico",["Mexico City, CDMX, Mexico"],"Mexico City",null,"CDMX","MX"],["Santiago, Chile",["Santiago, Santiago Metropolitan Region, Chile"],"Santiago",null,"Santiago Metropolitan Region","CL"],["Bogotá, Bogota, Colombia",["Bogotá, Bogota, Colombia"],"Bogotá",null,"Bogota","CO"],["Lima, Peru",["Lima, Peru"],"Lima",null,"Callao Region","PE"]],[null,"\u003cp\u003eAs an AI Outcome Customer Engineer in Google Cloud, you work as a technical debugger, engineering liaison, and technical delivery manager. You will bridge the gap between pre-sales agreement shaping and end-to-end post-sales execution, taking complex AI and agentic solutions from prototypes through MVP and into scaled production. You will ensure that solutions are shaped strictly through the lens of adoption, rapid consumption activation, measurable business ROI and viable delivery. \u003c/p\u003e\u003cp\u003eWorking closely alongside our Engineers, and implementation partners, you will architect how technical assets integrate into the customer's IT ecosystem (connectors, identity, data residency, legal constraints) while owning the delivery roadmap, environment readiness, and day-to-day engineering execution required to drive production scale.\u003c/p\u003eGoogle Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s cutting-edge technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems."],[2],[1790762901,929000000],[1791277767,637000000],[1791277767,918000000],[null,"In most instances, this position requires in-person interviews as part of the hiring process.\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003ePlease submit your resume in English - we can only consider applications submitted in this language.\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eApplicants in Mexico: Only applications of candidates with Mexican citizenship will be evaluated for this role in compliance with the provisions of Article 7 of the Federal Labor Law.\u003c/div\u003e"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: \u003cb\u003eMexico City, CDMX, Mexico; Santiago, Chile; Bogotá, Bogota, Colombia; Lima, Peru\u003c/b\u003e."],[null,"\u003cul\u003e\n\u003cli\u003eBachelor’s degree in Computer Science, Engineering, a related technical field, or equivalent practical experience.\u003c/li\u003e\n\u003cli\u003e5 years of experience in customer-facing technical delivery leadership, technical engagement management, solutions architecture, or enterprise AI/Cloud consulting.\u003c/li\u003e\n\u003cli\u003eExperience reading, evaluating, or debugging code in a general-purpose coding language (e.g., Python, Java, JavaScript) and diagnosing architectural blockers.\u003c/li\u003e\n\u003cli\u003eExperience in system design or orchestration frameworks (e.g., LangGraph, AutoGen, CrewAI).\u003c/li\u003e\n\u003cli\u003eExperience structuring technical delivery roadmaps, managing production deployments, and interfacing with product or engineering organizations.\u003c/li\u003e\n\u003cli\u003eAbility to communicate in English and Spanish fluently to engage with regional enterprise customers and global product teams.\u003c/li\u003e\n\u003c/ul\u003e"],2]],null,4,20], sideChannel: {}});</script>

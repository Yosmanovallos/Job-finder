    <!-- Google tag (gtag.js). gtag() and the config call below run right

    <script>

      gtag("js", new Date());
      const campaign = new URLSearchParams();

        const value = new URLSearchParams(window.location.search).get(key);
        if (value) campaign.set(key, value.slice(0, 100));
      }
      const safeLocation =
        window.location.origin +
        window.location.pathname +
        (campaign.size ? "?" + campaign.toString() : "");
      gtag("config", "G-QV1E0K4KZF", {
        page_location: safeLocation,
        page_path: window.location.pathname,
        page_title: document.title
      });
    </script>
    <!-- Deferred third parties (approved 2026-11-08): gtag.js (~180 KB) and
         AdSense Auto ads (~230 KB with show_ads_impl) used to download and
         run during first load, which was most of the mobile main-thread
         blocking time (Lighthouse TBT 460-620 ms). They now load on the
         visitor's first interaction, or 4 s after the page finished
         loading, whichever comes first. Events queued in dataLayer before
         then are sent when gtag.js arrives; a visit that leaves within
         those first seconds without interacting is the only one not
         counted. -->
    <script>
      (function () {
        var loaded = false;
        var events = ["pointerdown", "keydown", "scroll", "touchstart"];
        function inject(src, crossOrigin) {
          var script = document.createElement("script");
          script.async = true;
          script.src = src;
          if (crossOrigin) script.crossOrigin = "anonymous";
          document.head.appendChild(script);
        }
        function loadThirdParties() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (name) {
            window.removeEventListener(name, loadThirdParties);
          });
          inject("https://www.googletagmanager.com/gtag/js?id=G-QV1E0K4KZF", false);
          inject("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2247075733653451", true);
        }
        events.forEach(function (name) {
          window.addEventListener(name, loadThirdParties, { once: true, passive: true });
        });
        function afterLoad() {
          setTimeout(loadThirdParties, 4000);
        }
        if (document.readyState === "complete") afterLoad();
        else window.addEventListener("load", afterLoad, { once: true });
      })();
    </script>

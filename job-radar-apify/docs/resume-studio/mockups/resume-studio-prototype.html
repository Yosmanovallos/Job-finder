<title>Hoja de vida con IA · BuscoTrabajo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: same 4-view flow, dressed in buscotrabajo.co's own system:
   ink cards (2px border + hard offset shadow), green-soft hero, TINTS, gold CTA, Space Grotesk.
   Single light look on purpose, like the site. Values from src/index.css and src/lib/brand-tints.ts. */
:root{
  color-scheme:light;
  --background:#fafafa; --foreground:#0e1011; --body:#3d413e; --muted:#5a605b; --hover:#f4f5f2;
  --primary:#0f6b4f; --green-deep:#074a3a; --green-soft:#e2f4ec; --gold-1:#f3dfa2; --gold-2:#d4a537; --gold-ink:#2a1d06;
  --border:#e5e8e1; --bad:#d92d2d;
  --t1:#fdf1d3; --t1-fg:#2a1d06; --t1-sub:#7a5a0f;
  --t2:#e8f1fb; --t2-fg:#082f5c; --t2-sub:#0a4f96;
  --t3:#fde8dc; --t3-fg:#4a1c05; --t3-sub:#9a3d0c;
  --t4:#e4f6f5; --t4-fg:#063d3b; --t4-sub:#0b6f6b;
  --t5:#efe9fd; --t5-fg:#2e1065; --t5-sub:#6d28d9;
  --f-head:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --f-doc:Calibri,Carlito,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--background);color:var(--foreground)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-head);font-weight:700;letter-spacing:-.03em;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(243,223,162,.8)!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.ink-card{border:2px solid var(--foreground);box-shadow:4px 4px 0 var(--foreground)}
.ink-card-sm{border:2px solid var(--foreground);box-shadow:3px 3px 0 var(--foreground)}
.ink-lift{transition:transform .15s ease,box-shadow .15s ease}
.ink-lift:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--foreground)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- prototype chrome ---------- */
.chrome{max-width:1180px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.chrome .t{font-size:13px;color:var(--muted)}
.chrome .t b{color:var(--foreground);font-family:var(--f-head);font-size:15px}
.seg{display:inline-flex;background:#fff;border:2px solid var(--foreground);border-radius:999px;padding:2px}
.seg button{padding:5px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--body)}
.seg button[aria-pressed="true"]{background:var(--foreground);color:#fff}
.chip-btn{padding:7px 14px;border-radius:12px;font-size:13px;font-weight:700;background:#fff;border:2px solid var(--foreground);box-shadow:3px 3px 0 var(--foreground)}
.chip-btn.dark{background:var(--gold-2);color:var(--gold-ink)}
.stage{display:flex;justify-content:center}
.frame{width:100%;max-width:1180px;background:#fff;border-radius:24px;border:2px solid var(--foreground);box-shadow:4px 4px 0 var(--foreground);overflow:hidden;container-type:inline-size;min-height:560px;display:flex;flex-direction:column}
.frame.mobile{max-width:392px;border-radius:36px;border-width:3px;box-shadow:6px 6px 0 var(--foreground);min-height:780px}

/* ---------- site header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;padding:0 22px;border-bottom:2px solid var(--foreground);background:rgba(255,255,255,.92)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:20px;letter-spacing:-.03em}
.brand svg{width:28px;height:24px}
.steps{display:flex;align-items:center;gap:6px}
.steps>span{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--border);display:block}
.steps .on{background:var(--t1);border:2px solid var(--foreground);color:var(--foreground)}
.steps .on i,.steps .done i{background:var(--primary)}
@container (max-width:640px){.steps>span:not(.on){padding:0 3px}.steps>span:not(.on) .lb{display:none}.top{padding:0 14px}.brand span{display:none}}
.view{flex:1;display:flex;flex-direction:column;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding:40px 28px 48px}
@container (max-width:640px){.pad{padding:24px 16px 32px}}
.narrow{max-width:680px;margin:0 auto;width:100%}
.hero{background:linear-gradient(to bottom,var(--green-soft),#fff)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px;border:2px solid var(--foreground);box-shadow:3px 3px 0 var(--foreground);background:#fff;color:var(--foreground);text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--foreground)}
.btn.ink{background:var(--primary);color:#fff}
.btn.gold{background:var(--gold-2);color:var(--gold-ink)}
.btn.green{background:var(--primary);color:#fff}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:10px;box-shadow:2px 2px 0 var(--foreground)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--foreground)}
.btn-ai{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:12px;font-weight:700;background:var(--green-soft);border:2px solid var(--foreground);box-shadow:3px 3px 0 var(--foreground);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.btn-ai:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--foreground)}
.btn-ai::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.spark{width:18px;height:18px;color:var(--primary)}

/* ---------- job view ---------- */
.co{width:52px;height:52px;border-radius:14px;background:var(--foreground);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;border:2px solid var(--foreground)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--t1);border:2px solid var(--foreground);padding:3px 12px 3px 8px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--foreground)}
.eyebrow::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.job-title{font-size:clamp(30px,5cqi,52px);line-height:1.04;letter-spacing:-.04em;margin:16px 0 10px}
.job-title em{font-style:normal;color:var(--primary)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{font-size:13.5px;font-weight:600;color:var(--body);background:#fff;border:2px solid var(--foreground);border-radius:999px;padding:3px 12px}
.reqs{margin-top:28px;border-radius:20px;background:var(--t4);color:var(--t4-fg);padding:16px 18px}
.reqs summary{cursor:pointer;font-family:var(--f-head);font-weight:700;list-style:none;display:flex;justify-content:space-between}
.reqs summary::-webkit-details-marker{display:none}
.reqs ul{margin:12px 0 0;padding-left:18px;font-size:14px;display:grid;gap:6px}

/* ---------- upload view ---------- */
.jobchip{display:inline-flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:#fff;border:2px solid var(--foreground);box-shadow:3px 3px 0 var(--foreground);font-size:13px;max-width:100%}
.jobchip .co{width:28px;height:28px;border-radius:9px;font-size:11px;border-width:0}
.jobchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h1{font-size:clamp(30px,4.6cqi,46px);line-height:1.05;letter-spacing:-.04em;margin:20px 0 8px}
.lead{color:var(--body);font-size:17px}
.drop{margin-top:22px;border-radius:24px;background:var(--t4);border:2px solid var(--foreground);box-shadow:4px 4px 0 var(--foreground);padding:12px}
.drop-in{border:2px dashed rgba(6,61,59,.35);border-radius:16px;padding:30px 18px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--t4-fg)}
.drop .ico{width:52px;height:52px;border-radius:14px;background:#fff;border:2px solid var(--foreground);display:grid;place-items:center;color:var(--foreground)}
.drop b{font-family:var(--f-head);font-size:19px}
.consent{margin-top:22px;display:grid;gap:12px}
.ck{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.45;color:var(--body)}
.ck input{appearance:none;width:22px;height:22px;flex:0 0 22px;margin:0;border:2px solid var(--foreground);border-radius:6px;display:grid;place-items:center;cursor:pointer;background:#fff;box-shadow:2px 2px 0 var(--foreground)}
.ck input:checked{background:var(--primary)}
.ck input:checked::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ck a{font-weight:700;color:var(--primary);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.opt{color:var(--muted)}

/* ---------- workspace ---------- */
.ws{flex:1;min-height:660px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;padding:18px;min-height:0;background:var(--background)}
@container (max-width:820px){.ws{grid-template-columns:minmax(0,1fr);padding:12px}.ws[data-tab="agent"] .doc,.ws[data-tab="doc"] .agent{display:none}}
.wtabs{display:none;padding:12px 12px 0;background:var(--background)}
@container (max-width:820px){.wtabs{display:flex}}
.agent{display:flex;flex-direction:column;min-height:0;min-width:0;background:#fff;border:2px solid var(--foreground);box-shadow:4px 4px 0 var(--foreground);border-radius:24px;overflow:hidden}
.a-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:2px solid var(--foreground);background:var(--t1)}
.a-head b{font-family:var(--f-head);font-size:16px}
.orb{position:relative;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--primary),var(--gold-2),var(--green-deep),var(--primary));border:2px solid var(--foreground);flex:0 0 auto}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.orb.busy{animation:spin 1.6s linear infinite}
.orb.sm{width:20px;height:20px;border-width:1.5px}.orb.sm::after{inset:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t1-sub)}
.feed{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;max-height:540px}
.m-a{display:flex;gap:10px;align-items:flex-start}
.m-a p{font-size:15px;line-height:1.55;color:var(--foreground)}
.caret{display:inline-block;width:7px;height:15px;background:var(--primary);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.m-u{align-self:flex-end;background:var(--foreground);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 14px;font-size:14px;font-weight:500;max-width:85%}
.run{border-radius:16px;padding:12px 14px;margin-left:30px;background:var(--t2);color:var(--t2-fg);border:2px solid var(--foreground)}
.run-h{display:flex;justify-content:space-between;font-family:var(--f-head);font-size:14px;font-weight:700}
.run ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:7px}
.run li{display:flex;gap:9px;align-items:center;font-size:13px}
.run li .mt{margin-left:auto;color:var(--t2-sub);font-family:var(--f-mono);font-size:11px}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;display:grid;place-items:center;background:#fff}
.dot.wait{border:2px solid rgba(8,47,92,.25)}
.dot.doing{border:2px solid rgba(8,47,92,.2);border-top-color:var(--t2-fg);animation:spin .8s linear infinite}
.dot.done{background:var(--primary)}
.dot.done::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.qa{margin-left:30px;display:flex;flex-wrap:wrap;gap:8px}
.qchip{padding:7px 14px;border-radius:999px;border:2px solid var(--foreground);background:#fff;font-size:13.5px;font-weight:600;box-shadow:2px 2px 0 var(--foreground);transition:transform .15s,box-shadow .15s,background .15s}
.qchip:hover{background:var(--green-soft);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--foreground)}
.qin{margin-left:30px;display:flex;gap:6px}
.qin input{flex:1;min-width:0;border:2px solid var(--foreground);border-radius:999px;padding:7px 14px;font-size:13.5px;background:#fbfaf6}
.card{margin-left:30px;border:2px solid var(--foreground);box-shadow:3px 3px 0 var(--foreground);border-radius:16px;padding:14px;background:#fff}
.lab{display:inline-flex;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor}
.lab.r{background:var(--t2);color:var(--t2-sub)}.lab.f{background:var(--t1);color:var(--t1-sub)}
.diff{display:grid;gap:6px;margin:10px 0 12px;font-size:13.5px}
.del{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.ins{background:var(--green-soft);border-radius:10px;padding:7px 10px;color:#06392b}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.done-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--primary);font-weight:600}
.done-l.skip{color:var(--muted)}
.score-card{display:flex;gap:16px;align-items:center}
.ring{--v:0;width:78px;height:78px;flex:0 0 78px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--v)*1%),var(--border) 0);display:grid;place-items:center;border:2px solid var(--foreground)}
.ring span{width:60px;height:60px;border-radius:50%;background:#fff;border:2px solid var(--foreground);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:22px}
.score-card b{font-family:var(--f-head);font-size:16px}
.reqlist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px}
.reqlist li{display:flex;gap:9px;font-size:13px;align-items:flex-start;color:var(--body)}
.st{width:20px;height:20px;flex:0 0 20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--foreground);margin-top:0}
.st.ok{background:var(--green-soft);color:var(--primary)}.st.part{background:var(--t1);color:var(--t1-sub)}.st.bad{background:var(--t3);color:var(--t3-sub)}
.fine{font-size:11.5px;color:var(--muted);margin-top:10px;border-top:1.5px dashed var(--border);padding-top:8px}
.composer{padding:12px 16px 16px;border-top:2px solid var(--foreground);display:grid;gap:10px;background:#fff}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sugg button{flex:0 0 auto;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
.sugg button:nth-child(1){background:var(--t1);color:var(--t1-fg)}
.sugg button:nth-child(2){background:var(--t2);color:var(--t2-fg)}
.sugg button:nth-child(3){background:var(--t4);color:var(--t4-fg)}
.sugg button:nth-child(4){background:var(--t5);color:var(--t5-fg)}
.cbox{display:flex;align-items:center;gap:8px;border:2px solid var(--foreground);border-radius:14px;padding:5px 5px 5px 14px;background:#fbfaf6}
.cbox:focus-within{box-shadow:0 0 0 4px rgba(243,223,162,.8)}
.cbox input{flex:1;min-width:0;border:0;outline:0;font-size:14px;background:transparent}
.send{width:38px;height:38px;border-radius:10px;background:var(--gold-2);color:var(--gold-ink);border:2px solid var(--foreground);display:grid;place-items:center}

.doc{display:flex;flex-direction:column;background:var(--green-soft);min-width:0;border:2px solid var(--foreground);box-shadow:4px 4px 0 var(--foreground);border-radius:24px;overflow:hidden}
.d-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;justify-content:space-between;border-bottom:2px solid var(--foreground);background:#fff}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:#fff;border:2px solid var(--foreground);font-size:13px;font-weight:700}
.pill .n{min-width:30px;height:26px;padding:0 6px;border-radius:999px;background:var(--foreground);color:#fff;display:grid;place-items:center;font-size:12px;font-family:var(--f-head)}
.pill.up .n{background:var(--primary)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ibtn{width:34px;height:34px;border-radius:10px;background:#fff;border:2px solid var(--foreground);display:grid;place-items:center}
.ibtn[disabled]{opacity:.35}
.tsel{height:34px;border:2px solid var(--foreground);border-radius:10px;background:#fff;padding:0 8px;font-size:13px;font-weight:600}
.sheet-wrap{flex:1;padding:18px;display:flex;justify-content:center;align-items:flex-start}
.sheet{position:relative;width:100%;max-width:470px;aspect-ratio:8.5/11;background:#fff;border-radius:4px;border:2px solid var(--foreground);box-shadow:4px 4px 0 var(--foreground);padding:7% 8%;font-family:var(--f-doc);color:#1b1b1b;font-size:10.2px;line-height:1.4;overflow:hidden}
.sheet.empty{display:grid;align-content:start;gap:9px}
.sk{height:8px;border-radius:5px;background:linear-gradient(90deg,#eceee9,#f6f7f4,#eceee9);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.sheet.compact{font-size:9.4px;line-height:1.3}
.sheet h4{font-size:9.4px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid #222;margin:11px 0 5px;padding-bottom:2px;font-family:var(--f-doc)}
.sheet .nm{font-size:19px;font-weight:700}
.sheet .ttl{font-size:11px;color:#444}
.sheet .ct{font-size:9px;color:#555;margin-top:3px}
.sheet .jh{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.sheet .jo{color:#555;font-style:italic}
.sheet ul{margin:2px 0 6px;padding-left:13px}
.secs{display:flex;flex-direction:column}
.sheet.first .s-edu{order:-1}
.hl{background:#cdeedd;border-radius:2px}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wm span{transform:rotate(-28deg);font-family:var(--f-head);font-weight:700;font-size:26px;color:rgba(15,107,79,.1);white-space:nowrap}
.d-foot{padding:0 18px 18px;display:flex;justify-content:center}

/* ---------- pay view ---------- */
.jobban{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:24px;padding:20px 22px;background:var(--green-deep);color:#fff;position:relative;overflow:hidden;border:2px solid var(--foreground);box-shadow:4px 4px 0 var(--foreground)}
.jobban::before{content:"";position:absolute;left:-120px;top:-200px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(212,165,55,.5),rgba(212,165,55,0) 65%)}
.jobban::after{content:"";position:absolute;right:-120px;bottom:-240px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(31,163,122,.55),rgba(31,163,122,0) 65%)}
.jobban>*{position:relative;z-index:1}
.jobban .co{background:#fff;color:var(--foreground)}
.jobban .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-1)}
.jobban h2{font-size:22px;margin-top:2px}
.jobban .sc{margin-left:auto;text-align:right}
.jobban .sc b{font-family:var(--f-head);font-size:34px}
.pay-h{text-align:center;font-size:clamp(28px,4cqi,42px);letter-spacing:-.04em;margin:32px 0 24px}
.pay-h em{font-style:normal;color:var(--primary)}
.pay-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@container (max-width:820px){.pay-grid{grid-template-columns:minmax(0,1fr)}}

 const rel=cv.experience.filter(e=>/contab|administ/i.test(e.role));const m=rel.reduce((a,e)=>a+months(e.start,e.end),0);

  {...REQS[4],st:ia?"ok":"bad",ev:ia||"Tu CV no lo menciona"},
  {...REQS[5],st:doc?"ok":"bad",ev:doc||"No aparece"}];
 const text=[cv.summary,...B,...cv.skills].join(" ");
 const tk=[/conciliaci[oó]n(es)? bancari/i,/conciliaci[oó]n de cuentas/i,/contab/i,/atenci[oó]n al cliente|llamadas/i,/hablar en p[uú]blico/i,/tribut/i,/control interno/i,/estados financieros/i,/facturas de proveedores|cuentas (a|por) pagar/i,/organi[cz]|archiv/i].filter(r=>r.test(text)).length;
 const checks=[cv.summary.length>=110&&cv.summary.length<=420,B.every(b=>VERB.test(b)),true,true,true].filter(Boolean).length;
 const kws=["factura","conciliaci","nómina","excel","soportes"].filter(k=>cv.summary.toLowerCase().includes(k)).length;
 const p=s=>s==="ok"?1:s==="part"?.5:0;
 const comp=[res.slice(0,4).reduce((a,r)=>a+p(r.st)*10,0),res.slice(4).reduce((a,r)=>a+p(r.st)*7.5,0),tk*2,checks*3,(/contab/i.test(cv.summary)?5:0)+(kws>=2?5:0)];
 return{res,total:Math.round(comp.reduce((a,b)=>a+b,0)),comp,met:res.filter(r=>r.st==="ok").length};
}

 if(it.t==="q"){if(!it.open)return "";return `<div class="qa">${it.chips.map((c,j)=>`<button class="qchip" data-a="ans" data-i="${i}" data-v="${esc(c)}" ${j===(it.tour||0)?'data-tour="1"':""}>${esc(c)}</button>`).join("")}</div>${it.input?`<form class="qin" data-a="ansform" data-i="${i}"><input id="qi-${i}" placeholder="${esc(it.input)}" aria-label="${esc(it.input)}"><button class="send" aria-label="Enviar">${I.send}</button></form>`:""}`;}
 if(it.t==="prop")return `<div class="card"><div class="row" style="justify-content:space-between"><b style="font-size:14px">${esc(it.title)}</b><span class="lab ${it.kind==="Redacción"?"r":"f"}">${it.kind}</span></div><div class="diff"><span class="del">${esc(it.from)}</span><span class="ins">${esc(it.to)}</span></div>${it.open?`<div class="row"><button class="btn sm ink" data-a="prop" data-i="${i}" data-v="apply" data-tour="1">Aplicar</button><button class="btn sm" data-a="prop" data-i="${i}" data-v="skip">Omitir</button></div>`:`<span class="done-l ${it.res==="apply"?"":"skip"}">${it.res==="apply"?"✓ Aplicado":"Omitido"}</span>`}</div>`;
 if(it.t==="score"){const a=it.a;return `<div class="card"><div class="score-card"><div class="ring" style="--v:${a.total}"><span class="num">${a.total}</span></div><div><b>Compatibilidad estimada</b><div class="small muted">Cumples ${a.met} de 6 requisitos de la vacante</div></div></div>

 if(it.t==="win")return `<div class="card" style="background:var(--green-soft)"><div class="row" style="justify-content:space-between"><b>De ${it.from} a ${it.to} sin inventar nada</b><span class="num" style="font-family:var(--f-head);font-weight:700;color:var(--primary)">+${it.to-it.from}</span></div><div class="row" style="margin-top:10px"><button class="btn sm" data-a="cmp" data-v="before">Ver antes</button><button class="btn sm gold" data-a="go" data-v="pay">Descargar mi CV →</button></div></div>`;

let tt;function toast(t){clearTimeout(tt);let e=document.querySelector(".toast");if(!e){e=document.createElement("div");e.className="toast";e.setAttribute("role","status");document.body.appendChild(e);}e.textContent=t;tt=setTimeout(()=>e.remove(),2600);}

/* ============ agent engine ============ */
function push(it){S.feed.push(it);renderFeed();return it;}
function say(text){const it=push({t:"agent",text,shown:reduce?text.length:0});return new Promise(res=>{if(it.shown>=text.length)return res();const iv=setInterval(()=>{it.shown=Math.min(text.length,it.shown+3);renderFeed();if(it.shown>=text.length){clearInterval(iv);res();}},16);});}
async function run(steps){const it=push({t:"run",steps:steps.map(s=>({...s,st:"wait"}))});for(const s of it.steps){s.st="doing";renderFeed();await sleep(s.ms||700);s.st="done";renderFeed();}}
function setBusy(b){S.busy=b;renderFeed();}
function ask(o){setBusy(false);const it=push({t:"q",open:true,...o});return new Promise(r=>{it.resolve=v=>{it.open=false;push({t:"user",text:v});setBusy(true);r(v);};});}
function propose(o){setBusy(false);const it=push({t:"prop",open:true,...o});return new Promise(r=>{it.resolve=v=>{it.open=false;it.res=v;if(v==="apply")commit(o.apply);setBusy(true);renderFeed();r(v);};});}

async function agent(){
 S.busy=true;renderFeed();
 await run([{l:"Leyendo hoja-de-vida-laura.pdf",mt:"1 pág.",ms:900},{l:"Extrayendo tus datos",mt:"11/12 campos",ms:1000},{l:`Leyendo la vacante de ${JOB.company}`,mt:"6 requisitos",ms:800}]);
 S.cv=baseCv();renderDoc();
 await say("Ya tengo tu hoja de vida. Me falta un dato y no lo voy a adivinar: ¿cuándo terminó tu práctica en Distribuciones Ejemplo?");
 const end=await ask({chips:["ene 2024","dic 2023","No lo recuerdo"]});
 commit(cv=>{cv.experience[1].end=end==="ene 2024"?[2024,1]:end==="dic 2023"?[2023,12]:null;});S.hist=[];
 await sleep(400);const a0=analyze(S.cv);S.baseline={cv:clone(S.cv),a:a0};renderDoc();
 push({t:"score",a:a0});
 await say(`Cumples ${a0.met} de 6 requisitos. Puedo subir tu compatibilidad sin inventar nada. Empiezo por lo que ya está en tu CV.`);
 const rel=dur(months([2024,2],null));
 const sum=`Técnica Profesional en Contabilidad y Finanzas con ${rel} de experiencia como asistente contable: registro de facturas de proveedores, conciliaciones bancarias y archivo de soportes. Busco aportar como auxiliar contable.`;
 await propose({kind:"Redacción",title:"Resumen enfocado en el cargo",from:S.cv.summary,to:sum,apply:cv=>{cv.summary=sum;}});
 const map={"Registro de facturas de proveedores en el software contable.":"Registré facturas de proveedores en el software contable.","Archivo de soportes contables.":"Organicé y archivé los soportes contables del área.","Apoyo en conciliaciones bancarias mensuales.":"Apoyé las conciliaciones bancarias mensuales.","Atención de llamadas y correspondencia.":"Atendí llamadas y gestioné la correspondencia.","Elaboración de cuentas de cobro.":"Elaboré cuentas de cobro."};
 await propose({kind:"Redacción",title:"Viñetas que empiezan con un verbo",from:"Registro de facturas de proveedores…",to:"Registré facturas de proveedores…  (y 4 viñetas más)",apply:cv=>cv.experience.forEach(e=>e.bullets=e.bullets.map(b=>map[b]||b))});
 await say("Ahora necesito tus respuestas. Solo agrego lo que tú me confirmes.");
 await say("La vacante pide Excel «especialmente». ¿En qué tarea lo usas?");
 const x=await ask({chips:["En las conciliaciones bancarias","En reportes mensuales"],input:"Otra tarea…"});
 commit(cv=>{const e=cv.experience[0];const i=e.bullets.findIndex(b=>/conciliaci/i.test(b));if(/concilia/i.test(x)&&i>=0)e.bullets[i]=e.bullets[i].replace(/\.$/,"")+" usando Excel (tablas dinámicas y BUSCARV).";else e.bullets.push(`Usé Excel ${x.replace(/^en /i,"en ").replace(/\.$/,"").toLowerCase()}.`);});
 await say("Listo, lo puse en tu experiencia. ¿Has trabajado con nómina? Es un requisito obligatorio y tu CV no lo menciona.");
 const n=await ask({chips:["Sí, revisaba las novedades de nómina quincenal","No"]});
 if(n!=="No")commit(cv=>{cv.experience[0].bullets.push("Revisé las novedades de nómina quincenal antes de enviarlas al contador.");});
 else await say("Entendido. No lo agrego.");
 await say("Última: ¿has usado herramientas de inteligencia artificial en tu trabajo?");
 const ia=await ask({chips:["Sí","No"],tour:1});
 if(ia==="No")await say("Perfecto, lo dejo así. Ese requisito queda como no demostrado: es mejor que inventarlo.");
 else await say("En el producto te preguntaría qué herramienta y para qué tarea antes de agregarlo.");
 const a1=analyze(S.cv);push({t:"win",from:a0.total,to:a1.total});
 S.agentDone=true;setBusy(false);renderDoc();
}
async function freeText(t){push({t:"user",text:t});const was=S.busy;S.busy=true;renderFeed();await sleep(500);
 if(/plantilla/i.test(t)){await say("Puedes cambiarla arriba de tu CV. Tu contenido no cambia.");}
 else if(/ats|leer/i.test(t)){await say("Tu CV ya es de una columna, sin tablas ni imágenes, con encabezados estándar. Ningún formato garantiza pasar un filtro: cada sistema lee distinto.");}
 else if(/resumen|clar/i.test(t)){await say("Ya te propuse un resumen y viñetas más claras arriba. Si quieres otro tono, dime cuál (más corto, más formal).");}
 else await say("En este prototipo mis respuestas están escritas de antemano. En el producto te respondería con una propuesta que puedes aplicar u omitir, y te preguntaría antes de agregar cualquier dato nuevo.");
 S.busy=was;renderFeed();}

/* ============ events ============ */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(e.isTrusted&&S.touring&&a!=="tour")stopTour();
 if(b.tagName==="FORM")return;
 switch(a){
 case "device":S.device=v;try{localStorage.setItem("rs-dev",v);}catch(_){}render();break;
 case "reset":stopTour();S=fresh(S.device);render();break;
 case "tour":S.touring?stopTour():startTour();break;
 case "go":S.view=v;if(v==="job")S.feed=[];render();break;
 case "analyze":S.view="upload";render();break;
 case "ck":S.consent[v]=b.checked;render();break;
 case "legal":e.preventDefault();S.sheet=v;renderLayer();break;
 case "accept":S.consent[v]=true;S.sheet=null;render();break;
 case "close":if(e.target!==b&&b.classList.contains("scrim"))return;S.sheet=null;if(S.pay!=="wait")S.pay=null;renderLayer();break;
 case "upload":case "scratch":if(a==="scratch")toast("En el producto, el agente te entrevista para crearla. El prototipo continúa con un CV de ejemplo.");S.view="agent";S.feed=[];S.cv=null;render();agent();break;
 case "tab":S.tab=v;render();break;
 case "sugg":freeText(v);break;
 case "ans":{const it=S.feed[+b.dataset.i];if(it&&it.open)it.resolve(v);break;}
 case "prop":{const it=S.feed[+b.dataset.i];if(it&&it.open)it.resolve(v);break;}
 case "cmp":S.cmp=v;if(S.device==="mobile"){S.tab="doc";render();}else renderDoc();break;
 case "undo":if(S.hist.length){S.fut.push(clone(S.cv));S.cv=S.hist.pop();renderDoc();toast("Cambio deshecho");}break;
 case "redo":if(S.fut.length){S.hist.push(clone(S.cv));S.cv=S.fut.pop();renderDoc();toast("Cambio rehecho");}break;
 case "plan":S.plan=v;render();break;
 case "unlock":S.pay="open";renderLayer();break;
 case "payok":S.pay="wait";renderLayer();setTimeout(()=>{S.pay=null;S.view="done";render();},1500);break;
 case "payko":S.pay="ko";renderLayer();break;
 case "dl":toast(`En el producto se descarga «laura-mendez-auxiliar-contable.${v}». El prototipo no genera archivos.`);break;
 case "toast":toast(v);break;
 }});
document.addEventListener("change",e=>{if(e.target.id==="tpl"){S.tpl=e.target.value;renderDoc();}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
 if(f.dataset.a==="send"){const i=document.getElementById("cin");const t=i.value.trim();if(t){i.value="";freeText(t);}}
 if(f.dataset.a==="ansform"){const it=S.feed[+f.dataset.i];const inp=f.querySelector("input");const t=inp&&inp.value.trim();if(it&&it.open&&t)it.resolve(t);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.sheet||S.pay==="open"||S.pay==="ko")){S.sheet=null;S.pay=null;renderLayer();}});

/* ============ guided tour ============ */
let tiv=null;
function startTour(){S=fresh(S.device);S.touring=true;render();tiv=setInterval(tick,1500);}
function stopTour(){clearInterval(tiv);S.touring=false;const t=document.getElementById("tour");if(t)t.textContent="▶ Ver recorrido";}
function clk(sel,root){const el=(root||document).querySelector(sel);if(el){el.click();return true;}return false;}
function tick(){
 if(S.view==="job")return clk('[data-a="analyze"]');
 if(S.view==="upload"){if(!S.consent.data)return clk('#ck-data');if(!S.consent.terms)return clk('#ck-terms');return clk('[data-a="upload"]');}
 if(S.view==="agent"){if(S.busy)return;const els=document.querySelectorAll('#feed [data-tour]');if(els.length)return els[els.length-1].click();if(S.agentDone)return clk('[data-a="go"][data-v="pay"]');return;}
 if(S.view==="pay"){if(S.pay==="open")return clk('[data-a="payok"]');if(S.pay)return;return clk('[data-a="unlock"]');}
 if(S.view==="done")stopTour();}
render();
})();
</script>

# Render Blueprint — job-radar-apify
# https://render.com/docs/blueprint-spec
#
# This repo is a monorepo; the app lives in job-radar-apify/ (rootDir below).
# No secret VALUES live here — every sensitive key is `sync: false`, meaning
# Render prompts for it once in the dashboard and never stores it in git.
#
# Scraping does NOT run on this web service — it previously did (an in-process
# cron via ENABLE_CRON) and caused repeated out-of-memory crashes that took
# down login/dashboard/checkout along with the scraper (2026-07-25, see
# job-radar-apify/docs/BACKLOG.md). Scraping now runs entirely out-of-process
# via .github/workflows/scrape-jobs.yml (GitHub Actions, every 15 min),
# writing to the same Postgres this service reads from. This web service only
# ever serves the site and reads the DB — it must never import queue/scheduler.

services:
  - type: web
    name: job-radar-apify
    runtime: node
    rootDir: job-radar-apify
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      # Postgres (Supabase) connection string.
      - key: DATABASE_URL
        sync: false

      # Supabase Auth (also used client-side, hence the VITE_ prefix).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

      # Wompi payment gateway.
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false

      # Notion export (optional feature, not required for the app to boot).
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
